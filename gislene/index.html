<!doctype html>
<html lang="pt-BR">
<head>
<meta name="color-scheme" content="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gislene Giorgette</title>
<meta name="description" content="Gislene Giorgette — Análise técnica contratual & cerimonial. A segurança que o seu contrato precisa, a cerimônia que o seu amor merece.">
<meta name="theme-color" content="#460614">
<meta property="og:title" content="Gislene Giorgette">
<meta property="og:description" content="A segurança que o seu contrato precisa, a cerimônia que o seu amor merece.">
<meta property="og:image" content="img/logo.png">
<link rel="icon" type="image/png" href="img/icone.png">
<link rel="apple-touch-icon" href="img/apple-touch.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gislene Giorgette">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#460614; --wine-deep:#30030c; --wine-soft:#5e0f20;
    --gold:#ffd277; --gold-mid:#e3ac55; --gold-dark:#b9853a;
    --cream:#fbf1e4; --muted:#d9b98a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--wine-deep); color:var(--cream);
    display:flex; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .page{
    position:relative; overflow:hidden;
    width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
    background:radial-gradient(120% 70% at 50% 0%, var(--wine-soft) 0%, var(--wine) 55%, var(--wine-deep) 100%);
    padding:calc(48px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  @media (min-width:520px){ .page{box-shadow:0 0 40px rgba(0,0,0,.45)} }

  /* ---------- decoração de fundo: luzes desfocadas como no cartão ---------- */
  .glow{position:absolute; z-index:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,214,190,.16) 0%, rgba(255,214,190,0) 70%)}
  .glow.a{width:220px;height:220px;top:120px;left:-90px}
  .glow.b{width:160px;height:160px;top:360px;right:-50px}
  .glow.c{width:260px;height:260px;bottom:60px;left:-60px}
  .glow.d{width:120px;height:120px;bottom:220px;right:30px}
  .themis{
    position:absolute; z-index:0; left:50%; bottom:-10px; transform:translateX(-50%);
    width:118%; max-width:540px; opacity:.16; pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 45%);
            mask-image:linear-gradient(to bottom, transparent 0%, #000 45%);
  }

  .content{position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center}

  /* ---------- logo em círculo ---------- */
  .photo{
    width:176px; height:176px; border-radius:50%; overflow:hidden;
    border:4px solid var(--wine); box-shadow:0 0 0 2px var(--gold-mid), 0 14px 34px rgba(0,0,0,.45);
    background:var(--wine);
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---------- nome / lema ---------- */
  h1{
    font-family:"Cormorant Garamond",Georgia,serif; font-weight:500;
    font-size:2.45rem; letter-spacing:.02em; color:var(--cream); margin-top:22px; text-align:center; line-height:1.05;
  }
  .sub{
    font-style:italic; font-weight:400; text-transform:uppercase; text-align:center;
    color:var(--gold); font-size:.86rem; letter-spacing:.2em; line-height:1.6; margin-top:10px;
  }
  .rule{width:60px; height:1.5px; background:var(--gold-mid); margin:18px 0 0; opacity:.8}
  .cta{
    text-align:center; font-style:italic; text-transform:uppercase; letter-spacing:.06em;
    font-size:.84rem; font-weight:400; color:var(--cream); line-height:1.65;
    margin:16px 0 26px;
  }

  /* ---------- botões ---------- */
  .links{list-style:none; width:100%; max-width:340px; display:flex; flex-direction:column; gap:14px}
  .btn{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:100%; min-height:56px; padding:0 60px;
    border:0; border-radius:999px; cursor:pointer;
    background:linear-gradient(100deg,var(--gold-dark) 0%,var(--gold) 50%,var(--gold-mid) 100%);
    color:var(--wine-deep); text-decoration:none; font:inherit;
    font-size:.95rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.97); box-shadow:0 3px 8px rgba(0,0,0,.35)}
  .btn:focus-visible{outline:3px solid var(--cream); outline-offset:3px}
  .btn .ico{
    position:absolute; left:7px; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; background:var(--wine);
    display:grid; place-items:center; color:var(--gold);
  }
  .btn .ico svg{width:22px; height:22px}

  footer{margin-top:34px; font-size:.72rem; color:var(--muted); text-align:center; letter-spacing:.08em}

  .toast{
    position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); z-index:20;
    transform:translate(-50%,20px); opacity:0; transition:all .25s ease;
    background:var(--cream); color:var(--wine-deep); padding:12px 20px; border-radius:999px; font-size:.88rem; font-weight:600;
    box-shadow:0 8px 20px rgba(0,0,0,.4); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width:360px){
    .page{padding:40px 16px 28px}
    .photo{width:148px;height:148px}
    h1{font-size:2.05rem}
    .sub{font-size:.76rem; letter-spacing:.16em}
    .btn{font-size:.86rem; padding:0 52px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="page">
  <!-- fundo decorativo: luzes desfocadas + Têmis noiva do cartão -->
  <span class="glow a"></span><span class="glow b"></span>
  <span class="glow c"></span><span class="glow d"></span>
  <img class="themis" src="img/ill.png" alt="" aria-hidden="true" width="506" height="470">

  <div class="content">
    <div class="photo"><img src="img/logo.png" alt="Logo Gislene Giorgette" width="600" height="600"></div>

    <h1>Gislene Giorgette</h1>
    <p class="sub">Análise técnica contratual<br>&amp; cerimonial</p>
    <span class="rule" aria-hidden="true"></span>

    <p class="cta">A segurança que o seu contrato precisa,<br>a cerimônia que o seu amor merece</p>

    <ul class="links">
      <li>
        <a class="btn" href="contato.vcf" id="vcfBtn">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>
          Salvar contato
        </a>
      </li>
      <li>
        <a class="btn" href="https://www.instagram.com/gislene_cerimonialista/" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
          Instagram
        </a>
      </li>
      <li>
        <a class="btn" href="https://wa.me/5514933007561" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg></span>
          WhatsApp
        </a>
      </li>
    </ul>

    <footer>© <span id="ano">2026</span> Gislene Giorgette</footer>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  var toastEl = document.getElementById("toast");
  var toastTimer;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }
  document.getElementById("ano").textContent = new Date().getFullYear();

  // Salvar contato: no iPhone o link abre direto a ficha "Criar Novo Contato".
  // O Android sempre baixa o .vcf; ali damos um nome ao arquivo e explicamos o próximo toque.
  if (/Android/i.test(navigator.userAgent)) {
    var vcfBtn = document.getElementById("vcfBtn");
    vcfBtn.setAttribute("download", "Gislene Giorgette - Cerimonial.vcf");
    vcfBtn.addEventListener("click", function(){ toast("Toque em Abrir para salvar o contato"); });
  }

  // Sem internet: a página abre do cache, mas Instagram e WhatsApp precisam de conexão.
  Array.prototype.forEach.call(document.querySelectorAll('a[target="_blank"]'), function(a){
    a.addEventListener("click", function(e){
      if (navigator.onLine === false) {
        e.preventDefault();
        toast("Sem internet: conecte-se para abrir");
      }
    });
  });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function(){
      // Toda vez que abre com internet, confere se há versão nova publicada.
      navigator.serviceWorker.register("sw.js")
        .then(function(reg){ if (navigator.onLine !== false) reg.update().catch(function(){}); })
        .catch(function(){});
    });
    // Quando uma versão nova assume, recarrega uma vez para já mostrá-la.
    var tinhaVersao = !!navigator.serviceWorker.controller, recarregou = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (!tinhaVersao || recarregou) return;
      recarregou = true;
      location.reload();
    });
  }
</script>
</body>
</html>
