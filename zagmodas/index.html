<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zag Modas</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://zagmodas.github.io/">
<meta http-equiv="refresh" content="0; url=https://zagmodas.github.io/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdeee6;color:#6f4b3c;
       font-family:Georgia,serif;text-align:center;padding:16px}
  a{color:#946956;font-weight:bold}
</style>
</head>
<body>
<!-- A Zag Modas mudou para https://zagmodas.github.io — este endereço só redireciona. -->
<p>A Zag Modas mudou de endereço.<br><a href="https://zagmodas.github.io/">Toque aqui para abrir</a></p>
<script>
  var NOVO = "https://zagmodas.github.io/";
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ if (r.scope.indexOf("/zagmodas/") !== -1) r.unregister(); });
    }).catch(function(){});
  }
  location.replace(NOVO);
</script>
</body>
</html>
